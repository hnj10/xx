# ============================================================
# Dev environment - port 8081 matches the vite proxy target
# ============================================================
server.port=8081

# 局域网访问地址 http://192.168.68.4:8081/api
# 绑定本机局域网 IP（以太网 192.168.68.4），与前端 vite 代理目标保持一致。
server.address=192.168.68.4

# ============================================================
# MySQL datasource
# ============================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/genshin_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# ============================================================
# MyBatis-Plus
# ============================================================
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.fenglin.springboottest.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
# print executed SQL to console, handy while developing
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto
