# ============================================================
# Common config
# ============================================================
spring.application.name=springBootTest
spring.profiles.active=dev

# IMPORTANT:
# The frontend (genshin-login-vue/vite.config.js) proxies "/api" to
# http://localhost:8081 WITHOUT rewriting the path, so the request arriving
# at the backend still carries the /api prefix.
# That is why we set the context path to /api here:
#   controller "/user/login"  ->  actual URL "/api/user/login"
# which matches fetch('/api/user/login') in LoginCard.vue.
server.servlet.context-path=/api

# ============================================================
# Logging
# ============================================================
logging.level.root=info
logging.level.com.fenglin.springboottest=info
logging.file.name=log/xx.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss}  %level %logger{50}.%M %L:%m%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss}  %level %logger{50}.%M %L:%m%n
